<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🥕 당근 전국검색</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f7f7f7;color:#1a1a1a;min-height:100vh}

/* ── 헤더 */
header{background:#FF6F0F;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(255,111,15,.35)}
header .logo{font-size:28px}
header h1{color:#fff;font-size:20px;font-weight:800;flex:1}
#cookieBtn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}
#cookieBtn:hover{background:rgba(255,255,255,.35)}
#cookieStatus{font-size:11px;color:rgba(255,255,255,.75);margin-top:3px;text-align:center}

/* ── 검색바 */
.searchbar{background:#fff;padding:18px 24px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.search-row{display:flex;gap:10px;max-width:740px;margin:0 auto}
#q{flex:1;padding:13px 18px;border:2px solid #FF6F0F;border-radius:12px;font-size:16px;outline:none;transition:box-shadow .2s}
#q:focus{box-shadow:0 0 0 3px rgba(255,111,15,.18)}
#searchBtn{padding:13px 26px;background:#FF6F0F;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s}
#searchBtn:hover{background:#e56200}
#searchBtn:active{transform:scale(.97)}
#searchBtn:disabled{background:#ccc;cursor:default}
#status{max-width:740px;margin:8px auto 0;font-size:13px;color:#888;min-height:20px}

/* ── 스핀 */
.spin{display:inline-block;width:13px;height:13px;border:2px solid #FF6F0F;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 결과 그리드 */
#results{max-width:1120px;margin:24px auto 60px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}

/* ── 카드 */
.card{background:#fff;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid #ececec;display:block;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.11)}
.card-img{aspect-ratio:1;background:#f3f3f3;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .ni{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;color:#ddd}
.card-body{padding:10px 12px 14px}
.card-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.card-price{font-size:15px;font-weight:700}
.card-region{font-size:11px;color:#aaa;margin-top:3px}

/* ── 빈/안내 상태 */
#guide{text-align:center;padding:72px 24px;color:#bbb;grid-column:1/-1;display:none}
#guide .gi{font-size:52px;margin-bottom:14px}
#guide h2{font-size:20px;color:#555;margin-bottom:8px}
#guide p{font-size:14px;line-height:1.8;color:#999}
#guide.show{display:block}

/* ── 쿠키 모달 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
.modal-box{background:#fff;border-radius:18px;width:min(92vw,560px);padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box h2{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-box .desc{font-size:13px;color:#666;line-height:1.7;margin-bottom:18px}
.code-block{background:#1e1e1e;color:#7ec8e3;border-radius:10px;padding:14px 16px;font-family:monospace;font-size:13px;margin-bottom:16px;position:relative;user-select:all}
.copy-btn{position:absolute;top:10px;right:10px;background:#444;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.copy-btn:hover{background:#666}
.modal-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.modal-box textarea{width:100%;height:90px;border:1.5px solid #ddd;border-radius:8px;padding:10px;font-size:12px;font-family:monospace;resize:vertical;outline:none}
.modal-box textarea:focus{border-color:#FF6F0F}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.btn-cancel{padding:10px 18px;background:#f0f0f0;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.btn-save{padding:10px 20px;background:#FF6F0F;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn-save:hover{background:#e56200}
.saved-badge{display:inline-block;background:#e6f9ec;color:#2e7d4f;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;margin-left:8px}
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div class="logo">🥕</div>
  <div style="flex:1">
    <h1>당근 전국검색</h1>
  </div>
  <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px">
    <div style="display:flex;gap:7px">
      <button id="autoBtn" onclick="autoCookies()" style="background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">⚡ 쿠키 자동가져오기</button>
      <button id="cookieBtn" onclick="openModal()">🔑 직접 입력</button>
    </div>
    <div id="cookieStatus">미설정 (설정 시 더 많은 결과)</div>
  </div>
</header>

<!-- 검색바 -->
<div class="searchbar">
  <div class="search-row">
    <input id="q" type="text" placeholder="예: 비스포크 제트 헤드, 아이폰 15, 에어팟..." autocomplete="off"/>
    <button id="searchBtn" onclick="doSearch()">🔍 전국검색</button>
  </div>
  <div id="status"></div>
</div>

<!-- 결과 -->
<div id="results">
  <div id="guide" class="show">
    <div class="gi">🥕</div>
    <h2>전국 당근 매물을 한번에 검색하세요</h2>
    <p>
      서버가 전국 여러 지역을 동시에 검색해 결과를 보여줍니다.<br/>
      <strong>더 많은 결과</strong>를 원하면 우측 상단 <strong>🔑 쿠키 설정</strong>에서<br/>당근 로그인 쿠키를 입력해주세요.
    </p>
  </div>
</div>

<!-- 쿠키 모달 -->
<div id="modal">
  <div class="modal-box">
    <h2>🔑 당근 로그인 쿠키 설정 <span class="saved-badge" id="savedBadge" style="display:none">저장됨 ✓</span></h2>
    <p class="desc">
      쿠키를 설정하면 로그인 상태로 검색해 더 정확한 결과를 볼 수 있어요.<br/>
      <strong>1. 크롬에서 <a href="https://www.daangn.com" target="_blank" style="color:#FF6F0F">daangn.com</a> 로그인 후</strong><br/>
      <strong>2. 아래 코드를 콘솔(F12 → Console)에 붙여넣고 실행</strong>
    </p>
    <div class="code-block" id="codeBlock">document.cookie<button class="copy-btn" onclick="copyCode()">복사</button></div>
    <label>📋 콘솔에서 출력된 값을 여기에 붙여넣기</label>
    <textarea id="cookieInput" placeholder="s_da=xxxx; carrot_uid=xxxx; ..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveCookie()">저장</button>
    </div>
  </div>
</div>

<script>
// ── 쿠키 모달 ────────────────────────────────
function openModal() {
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
function copyCode() {
  navigator.clipboard.writeText('document.cookie').then(() => {
    document.querySelector('.copy-btn').textContent = '✓ 복사됨';
    setTimeout(() => document.querySelector('.copy-btn').textContent = '복사', 1500);
  });
}
async function saveCookie() {
  const val = document.getElementById('cookieInput').value.trim();
  const res = await fetch('/api/cookies', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({cookies: val})
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('cookieStatus').textContent = val ? '✅ 쿠키 설정됨' : '미설정';
    document.getElementById('savedBadge').style.display = val ? 'inline-block' : 'none';
    closeModal();
  }
}

// ── 자동 쿠키 ────────────────────────────────
async function autoCookies() {
  const btn = document.getElementById('autoBtn');
  const status = document.getElementById('cookieStatus');
  btn.textContent = '⏳ 읽는 중...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/auto-cookies');
    const data = await res.json();
    if (data.found) {
      status.textContent = '✅ 쿠키 자동 적용됨';
    } else {
      status.textContent = '⚠️ ' + data.msg + ' (Chrome/Safari에서 daangn.com 열고 다시 시도)';
    }
  } catch(e) {
    status.textContent = '⚠️ 자동 가져오기 실패';
  }
  btn.textContent = '⚡ 쿠키 자동가져오기';
  btn.disabled = false;
}

// 페이지 로드 시 자동 시도
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await fetch('/api/auto-cookies');
    const data = await res.json();
    if (data.found) {
      document.getElementById('cookieStatus').textContent = '✅ 쿠키 자동 적용됨';
    }
  } catch(e) {}
});

// ── 검색 ─────────────────────────────────────
let aborted = false;

async function doSearch() {
  const query = document.getElementById('q').value.trim();
  if (!query) return;

  aborted = false;
  const btn    = document.getElementById('searchBtn');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const guide  = document.getElementById('guide');

  // 초기화
  results.innerHTML = '';
  guide.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '검색 중…';

  // 지역 ID 가져오기
  status.innerHTML = '<span class="spin"></span>지역 목록 로딩...';
  let ids = [];
  try {
    const r = await fetch('/api/regions');
    const d = await r.json();
    ids = d.ids || [];
  } catch {
    status.textContent = '서버 연결 실패. python server.py 실행 확인';
    btn.disabled = false;
    btn.textContent = '🔍 전국검색';
    return;
  }

  let found = 0;
  let done  = 0;
  const total = ids.length;

  // 배치 병렬 요청
  const BATCH = 15;
  for (let i = 0; i < ids.length; i += BATCH) {
    if (aborted) break;
    const batch = ids.slice(i, i + BATCH);

    await Promise.all(batch.map(async id => {
      try {
        const r = await fetch(`/api/search?q=${encodeURIComponent(query)}&id=${id}`);
        const d = await r.json();
        (d.articles || []).forEach(a => {
          found++;
          results.appendChild(makeCard(a, d.region));
        });
      } catch {}
      done++;
    }));

    const pct = Math.round(done / total * 100);
    status.innerHTML = `<span class="spin"></span>검색 중 ${pct}% (${found}개 발견)`;
  }

  btn.disabled = false;
  btn.textContent = '🔍 전국검색';

  if (found === 0) {
    guide.classList.add('show');
    document.querySelector('#guide .gi').textContent = '😢';
    document.querySelector('#guide h2').textContent = '검색 결과가 없어요';
    document.querySelector('#guide p').innerHTML =
      '다른 검색어로 시도하거나, 쿠키를 설정하면 더 많은 결과를 볼 수 있어요.';
    results.appendChild(guide);
    status.textContent = `검색 완료 — ${total}개 지역 검색`;
  } else {
    status.innerHTML = `✅ 총 <strong>${found}개</strong> 매물 발견 (${total}개 지역)`;
  }
}

function makeCard(a, region) {
  const link  = document.createElement('a');
  link.className = 'card';
  link.href   = a.href || '#';
  link.target = '_blank';
  link.rel    = 'noopener noreferrer';

  const thumb = a.thumbnail || (Array.isArray(a.images) && a.images[0]) || '';
  const price = a.price
    ? Number(a.price).toLocaleString('ko-KR') + '원'
    : '가격 미정';

  link.innerHTML = `
    <div class="card-img">
      ${thumb
        ? `<img src="${thumb}" alt="" loading="lazy"/>`
        : `<div class="ni">📦</div>`}
    </div>
    <div class="card-body">
      <div class="card-title">${a.title || ''}</div>
      <div class="card-price">${price}</div>
      <div class="card-region">📍 ${region || ''}</div>
    </div>`;
  return link;
}

// 엔터 검색
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
